name: Compatibility report
description: Report a reproducible setup or gameplay problem
body:
  - type: dropdown
    id: stage
    attributes:
      label: Where did it happen?
      options:
        - Opening the Mac app
        - Apple toolkit or Rosetta setup
        - Preparing the bottle or updating Steam
        - Steam sign-in or game installation
        - Starting the game
        - Gameplay, video, audio, or controls
    validations:
      required: true
  - type: input
    id: machine
    attributes:
      label: Mac and macOS
      placeholder: M5 Pro, 24 GB, macOS 27.0.1
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Project, toolkit, and game versions
    validations:
      required: true
  - type: textarea
    id: symptom
    attributes:
      label: Symptom and steps
      description: Include resolution, MSync, HUD, and DLSS settings. Describe the visible stage.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Reviewed diagnostics
      description: Paste doctor.command output. Never upload raw logs, your bottle, or authentication tickets.
