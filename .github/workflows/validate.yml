name: Validate scripts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: for file in install.sh scripts/*.sh scripts/*.command tests/*.sh; do bash -n "$file"; done
      - name: Check patch syntax
        run: git apply --numstat patches/*.patch
